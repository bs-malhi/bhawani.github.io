[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# --- Canonical host: one version of the site only -------------------------
# Old Netlify address -> new domain (301 = permanent, passes ranking signals)
[[redirects]]
  from = "https://bhawanigrowth.netlify.app/*"
  to = "https://gsvisibility.com/:splat"
  status = 301
  force = true

# www -> non-www
[[redirects]]
  from = "https://www.gsvisibility.com/*"
  to = "https://gsvisibility.com/:splat"
  status = 301
  force = true

# --- Security headers ------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Fonts never change: cache for a year
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
