backend:
  name: git-gateway
  branch: main          # must match your GitHub repo's default branch (main or master)

site_url: https://gsvisibility.com
display_url: https://gsvisibility.com
locale: en

media_folder: "src/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/blog"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Title (shown as the page heading)", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Last Updated (optional)", name: "updated", widget: "datetime", required: false, hint: "Set this when you make a meaningful update to an older post" }
      - { label: "Author", name: "author", widget: "string", default: "Bhawani Shankar" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false, hint: "Recommended 1200 x 630 px" }
      - { label: "Featured Image Alt Text", name: "featured_image_alt", widget: "string", required: false, hint: "Describe the image in a short sentence (accessibility and image SEO)" }
      - { label: "Focus Keyword", name: "focus_keyword", widget: "string", required: false, hint: "The main search term this post targets. Use it in the title, first paragraph and one heading." }
      - { label: "Meta Title (SEO)", name: "meta_title", widget: "string", required: false, pattern: ['^.{0,65}$', "Keep it to 65 characters or fewer"], hint: "Shown in Google results and the browser tab. Leave blank to reuse the Title." }
      - { label: "Meta Description (SEO)", name: "meta_description", widget: "text", required: false, pattern: ['^[\s\S]{0,160}$', "Keep it to 160 characters or fewer"], hint: "Shown under the title in Google results." }
      - { label: "Body", name: "body", widget: "markdown" }
