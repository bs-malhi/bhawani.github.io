backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Bhawani Shankar" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Focus Keyword", name: "focus_keyword", widget: "string", required: false, hint: "The main search term this post targets" }
      - { label: "Meta Title (SEO)", name: "meta_title", widget: "string", required: false, hint: "Shown in the Google search result and browser tab. Leave blank to reuse the Title above." }
      - { label: "Meta Description (SEO)", name: "meta_description", widget: "text", required: false, hint: "Shown under the title in Google search results, under ~160 characters." }
      - { label: "Body", name: "body", widget: "markdown" }
